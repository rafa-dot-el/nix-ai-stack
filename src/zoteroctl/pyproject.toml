[project]
name = "zoteroctl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "bibtexparser>=1.4",
]

[project.scripts]
zoteroctl = "zoteroctl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-mock>=3.14",
  "responses>=0.25",
  "types-PyYAML>=6.0",
  "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --cov=zoteroctl --cov-branch --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["zoteroctl/cli.py", "zoteroctl/__main__.py"]

[tool.uv.extra-build-dependencies]
"bibtexparser" = ["setuptools"]
