version: "3"

silent: true

vars:
  PKG_DIR: "{{.TASKFILE_DIR}}"

# One include per package under packages/ (build, test, check-update, update).
includes:
  pkg:claude-code:
    taskfile: ./packages/claude-code
    dir: ./packages/claude-code
  pkg:antigravity-cli:
    taskfile: ./packages/antigravity-cli
    dir: ./packages/antigravity-cli
  pkg:claude-agent-acp:
    taskfile: ./packages/claude-agent-acp
    dir: ./packages/claude-agent-acp
  pkg:openspec:
    taskfile: ./packages/openspec
    dir: ./packages/openspec
  pkg:likec4:
    taskfile: ./packages/likec4
    dir: ./packages/likec4
  pkg:claude-desktop:
    taskfile: ./packages/claude-desktop
    dir: ./packages/claude-desktop
  pkg:plannotator:
    taskfile: ./packages/plannotator
    dir: ./packages/plannotator
  pkg:patternfly-mcp:
    taskfile: ./packages/patternfly-mcp
    dir: ./packages/patternfly-mcp
  pkg:notebooklm-py:
    taskfile: ./packages/notebooklm-py
    dir: ./packages/notebooklm-py

tasks:
  default:
    desc: "List tasks"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - task --list-all

  check:
    desc: "Full syntax/eval validation: lint (nix parse + actionlint) + flake eval check"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - task: lint
      - nix eval --raw .#default.drvPath

  lint:
    desc: "Parse-check every .nix file (recursive) and lint GitHub Actions workflow YAML"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        rc=0
        for f in $(find . -name '*.nix' -not -path './.git/*' -not -path './result*'); do
          nix-instantiate --parse "$f" >/dev/null 2>&1 || { echo "FAIL: $f"; rc=1; }
        done
        nix develop .#default -c actionlint .github/workflows/*.yml || rc=1
        exit $rc


  rust:test:
    desc: "Run the Rust workspace's tests (cargo nextest) and clippy"
    dir: "{{.TASKFILE_DIR}}/src"
    cmds:
      - nix develop "{{.TASKFILE_DIR}}#rust" -c cargo nextest run --workspace {{.CLI_ARGS}}
      - nix develop "{{.TASKFILE_DIR}}#rust" -c cargo clippy --workspace --all-targets -- -D warnings

  rust:cov:
    desc: "Line coverage (cargo llvm-cov): the pure crates must reach 95%, the whole workspace 85%"
    dir: "{{.TASKFILE_DIR}}/src"
    vars:
      # The effectful code: binaries, servers, CLI glue, HTTP and file I/O. Everything else is
      # pure (mcp-filter, mcp-tokens, rafa-config, toon, gworkspace-api, gworkspace-auth, and
      # slack's analysis, blocks, config, policy, send, spec, target and wire modules,
      # tmpmail's format and identities, claude-usage's creds, exporter, format, model,
      # table and vars).
      EFFECTFUL: '/src/(mcp|mcp-serve|voice|gworkspace/tools)/|/src/slack/src/(actions|client|main|mcp|prepare|read|setup)\.rs|/src/tmpmail/src/(api|main|mcp|ops|setup)\.rs|/src/claude-usage/src/(client|config|main)\.rs'
    cmds:
      - nix develop "{{.TASKFILE_DIR}}#rust" -c cargo llvm-cov nextest --workspace --no-report {{.CLI_ARGS}}
      - echo "[*] pure crates (gate 95%)"
      - nix develop "{{.TASKFILE_DIR}}#rust" -c cargo llvm-cov report --summary-only --ignore-filename-regex '{{.EFFECTFUL}}' --fail-under-lines 95
      - echo "[*] whole workspace (floor 85%)"
      - nix develop "{{.TASKFILE_DIR}}#rust" -c cargo llvm-cov report --summary-only --fail-under-lines 85

  py:test:
    desc: "pytest for a first-party Python project (PROJECT=calibrectl|zoteroctl), with per-module coverage"
    dir: "{{.TASKFILE_DIR}}/src/{{.PROJECT}}"
    requires: { vars: [PROJECT] }
    cmds:
      - nix develop "{{.TASKFILE_DIR}}#python" -c python -m pytest -p no:cacheprovider --cov-report=term-missing {{.CLI_ARGS}}

  check:inputs:
    desc: "Every nixpkgs in flake.lock must be the root nixpkgs or nixpkgs-unstable (all inputs follow, ADR-0001)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        bad="$(nix develop .#default -c jq -r -f scripts/check-inputs.jq flake.lock)"
        if [ -n "$bad" ]; then
          echo "[-] check:inputs: nixpkgs nodes that do not follow a root channel:"
          echo "$bad"
          exit 1
        fi
        echo "[+] check:inputs: every nixpkgs follows a root channel"

  build:
    desc: "Build the default package: Hermes (CLI + TUI + web dashboard + ACP + TTS/STT)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - nix build .#default --no-link

  build:slim:
    desc: "Build hermes-slim (bare CLI + TUI, no browser/voice/LSP extras)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - nix build .#hermes-slim --no-link

  build:desktop:
    desc: "Build the Hermes Desktop launcher (picks x11/wayland at runtime)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - nix build .#hermes-desktop --no-link

  # TUI is the default face of the agent: `task` / `task run` drops into the
  # Ink TUI chat. --tui is explicit so it wins over any display.interface
  # config and never silently falls back to the classic REPL.
  run:
    desc: "Launch the Hermes TUI chat (default)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        out="$(nix build --no-link --print-out-paths .#default)"
        exec "$out/bin/hermes" chat --tui {{.CLI_ARGS}}

  run:cli:
    desc: "Launch the classic REPL chat (no TUI)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        out="$(nix build --no-link --print-out-paths .#default)"
        exec "$out/bin/hermes" chat --cli {{.CLI_ARGS}}

  run:dashboard:
    desc: "Launch the Hermes web dashboard (localhost:9119)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        out="$(nix build --no-link --print-out-paths .#default)"
        exec "$out/bin/hermes" dashboard {{.CLI_ARGS}}

  run:desktop:
    desc: "Launch the Hermes Desktop app (picks x11/wayland at runtime)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        out="$(nix build --no-link --print-out-paths .#hermes-desktop)"
        exec "$out/bin/hermes-desktop" {{.CLI_ARGS}}

  # run:<name>: build and exec a package from THIS flake (never the one on the system PATH).
  # Arguments after `--` go to the program: task run:claude -- --version
  run:pkg:
    desc: "Run any package of this flake: task run:pkg PKG=<flake package> [BIN=<binary>] -- <args>"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    requires:
      vars: [PKG]
    cmds:
      - |
        set -euo pipefail
        out="$(nix build --no-link --print-out-paths ".#{{.PKG}}")"
        exec "$out/bin/{{.BIN | default .PKG}}" {{.CLI_ARGS}}

  run:claude:
    desc: "Run Claude Code from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: claude-code, BIN: claude, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:claude-desktop:
    desc: "Run Claude Desktop from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: claude-desktop, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:acp:
    desc: "Run the Claude ACP adapter from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: claude-agent-acp, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:goose:
    desc: "Run the goose CLI from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: goose-cli, BIN: goose, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:goose-desktop:
    desc: "Run the goose desktop app from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: goose-desktop, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:agy:
    desc: "Run the Antigravity CLI from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: antigravity-cli, BIN: agy, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:ollama:
    desc: "Run the ollama CLI from this flake (no service)"
    cmds:
      - task: run:pkg
        vars: { PKG: ollama, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:mcp:
    desc: "Run the mcp binary (proxy, client, doctor) from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: mcp, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:slack:
    desc: "Run the slack CLI from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: slack, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:openspec:
    desc: "Run openspec from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: openspec, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:plannotator:
    desc: "Run plannotator from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: plannotator, CLI_ARGS: "{{.CLI_ARGS}}" }

  run:likec4:
    desc: "Run likec4 from this flake"
    cmds:
      - task: run:pkg
        vars: { PKG: likec4, CLI_ARGS: "{{.CLI_ARGS}}" }

  test:unit:
    desc: "Unit tests: repo gates (tests/unit) and the mock OpenAI backend (pure Python, no nix build, no network)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - nix develop .#itest -c pytest tests/unit tests/integration/test_mock_openai.py -v {{.CLI_ARGS}}

  test:integration:
    desc: "Run hermes-acp against the mock OpenAI backend (browser_exec drives a headless Chromium)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        HERMES_OUT="$(nix build .#default --no-link --print-out-paths)"
        export HERMES_OUT
        nix develop .#itest -c pytest tests/integration -v {{.CLI_ARGS}}

  test:check:
    desc: "Build only the named flake checks: task test:check -- mcp-lib home-module"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        names="{{.CLI_ARGS}}"
        [ -n "$names" ] || { echo "[-] name at least one check, e.g. task test:check -- mcp-lib" >&2; exit 2; }
        system="$(nix eval --raw --impure --expr builtins.currentSystem)"
        targets=""
        for name in $names; do targets="$targets .#checks.${system}.${name}"; done
        nix build --no-link --print-build-logs $targets
        echo "[+] checks passed: $names"

  test:
    desc: "Build every flake check for this system (checks/*.nix: pure eval and sandboxed tests)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        system="$(nix eval --raw --impure --expr builtins.currentSystem)"
        names="$(nix eval --raw ".#checks.${system}" --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)')"
        targets=""
        for name in $names; do targets="$targets .#checks.${system}.${name}"; done
        echo "[*] checks: ${names}"
        nix build --no-link $targets
        echo "[+] checks passed: ${names}"

  cache:push:
    desc: >-
      Build the default package (Hermes) and push the resulting store path
      to the rafa-dot-el Cachix cache. Reads the push
      token from pass (code/cachix/tokens-main-ci); never persists it to
      disk.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        out="$(nix build .#default --no-link --print-out-paths)"
        echo "[*] Pushing $out to rafa-dot-el..."
        CACHIX_AUTH_TOKEN="$(pass show code/cachix/tokens-main-ci)" \
          nix run nixpkgs#cachix -- push rafa-dot-el "$out"
        echo "[+] Pushed the default package to rafa-dot-el"

  oci:build:
    desc: >-
      Build the OCI image (rafadotel/ai) via dockerTools and load
      it into the local docker daemon. Pass TAG=vX.Y.Z to also tag that
      version (the leading "v" is stripped for the Docker tag); otherwise
      only :latest is tagged. Builds for the host's own architecture only —
      run this on an aarch64 host to publish an arm64 image (see build.yml's
      oci job comment for why CI doesn't do this yet).
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        out="$(nix build .#ociImage --no-link --print-out-paths)"
        docker load < "$out"
        docker tag ai:latest rafadotel/ai:latest
        if [ -n "${TAG:-}" ]; then
          docker tag ai:latest "rafadotel/ai:${TAG#v}"
        fi
        echo "[+] Loaded rafadotel/ai:latest${TAG:+ and :${TAG#v}}"

  oci:push:
    desc: >-
      Build and push the OCI image to Docker Hub as rafadotel/ai.
      Pass TAG=vX.Y.Z to also push that version tag. Reads the access token
      from pass (code/hub.docker.com-token); never persists it to disk.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - task: oci:build
      - |
        set -euo pipefail
        pass show code/hub.docker.com-token | docker login -u rafadotel --password-stdin
        docker push rafadotel/ai:latest
        if [ -n "${TAG:-}" ]; then
          docker push "rafadotel/ai:${TAG#v}"
        fi
        echo "[+] Pushed rafadotel/ai:latest${TAG:+ and :${TAG#v}}"

  tag:
    desc: >-
      Create an annotated git tag (TAG=vX.Y.Z required) and push it to both
      internal and public remotes. Pushing a v* tag triggers CI's build →
      Cachix → OCI → release pipeline; run this task alone (without task
      release) if you only want that.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        : "${TAG:?TAG=vX.Y.Z is required}"
        git tag -a "$TAG" -m "$TAG"
        git push internal "$TAG"
        git push public "$TAG"
        echo "[+] Tagged and pushed $TAG"

  release:
    desc: >-
      Create a GitHub Release for TAG=vX.Y.Z (the tag must already exist —
      run `task tag TAG=vX.Y.Z` first), linking Cachix and Docker Hub.
      Local equivalent of build.yml's release job, for publishing without CI.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        : "${TAG:?TAG=vX.Y.Z is required}"
        gh release create "$TAG" -R rafa-dot-el/nix-ai-stack \
          --title "$TAG" \
          --generate-notes \
          --notes "Cachix cache: https://app.cachix.org/cache/rafa-dot-el#pull
        Docker Hub image: https://hub.docker.com/r/rafadotel/ai (tag ${TAG#v})"
        echo "[+] Released $TAG"

  clean:
    desc: "Remove local build symlinks (does not touch the Nix store). Fast (~1s)."
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - rm -rf result result-*

  check-update:
    desc: >-
      Report the pinned vs latest version of Hermes and of every package. Exit
      0 when any update is available, 1 when everything is current, 2 on errors.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -uo pipefail
        available=0
        for t in hermes:check-update \
                 pkg:claude-code:check-update pkg:claude-agent-acp:check-update \
                 pkg:claude-desktop:check-update pkg:antigravity-cli:check-update \
                 pkg:openspec:check-update pkg:plannotator:check-update \
                 pkg:likec4:check-update pkg:notebooklm-py:check-update \
                 pkg:patternfly-mcp:check-update; do
          rc=0; out="$(task -x "$t" 2>&1)" || rc=$?
          printf '%s\n' "$out" | grep -E 'check-update:' | grep -v 'Failed to run task' || true
          case "$rc" in
            0) available=1 ;;
            1) ;;
            *) echo "[-] $t failed (exit $rc)" >&2; exit 2 ;;
          esac
        done
        [ "$available" -eq 1 ]

  hermes:check-update:
    desc: >-
      Compare the pinned upstream tag (flake.nix hermes-agent-src url) against
      the latest published release of NousResearch/hermes-agent. Exit 0 when an
      update is available, 1 when current, 2 on errors.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        FLAKE="{{.PKG_DIR}}/flake.nix"
        PINNED="$(grep -m1 'github:NousResearch/hermes-agent/' "$FLAKE" | sed -E 's#.*github:NousResearch/hermes-agent/([^"]+)".*#\1#')"
        : "${PINNED:?could not read pinned tag from flake.nix}"
        # Upstream moved from calendar tags (vYYYY.M.D) to semver (v0.21.7), so
        # `sort -V` over tag names would rank a stale calendar tag above a newer
        # semver one. "Latest release" is ordered by publish date instead.
        LATEST="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)"
        : "${LATEST:?could not resolve latest upstream release tag}"
        if [ "$PINNED" != "$LATEST" ]; then
          echo "[*] check-update: hermes ${PINNED} -> ${LATEST}"
          exit 0
        fi
        echo "[*] check-update: hermes up to date (${PINNED})"
        exit 1

  update:
    desc: >-
      Bump Hermes and then every package to its latest upstream version (one
      after another; each step builds and tests). Pass TAG=vX.Y.Z to pin Hermes
      explicitly.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - task: hermes:update
      - task: update:packages

  update:packages:
    desc: "Bump every package under packages/ to its latest upstream version (build and test each)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - task: pkg:claude-code:update
      - task: pkg:claude-agent-acp:update
      - task: pkg:claude-desktop:update
      - task: pkg:antigravity-cli:update
      - task: pkg:openspec:update
      - task: pkg:plannotator:update
      - task: pkg:likec4:update
      - task: pkg:notebooklm-py:update
      - task: pkg:patternfly-mcp:update

  hermes:update:
    desc: >-
      Bump hermes-agent-src url to the latest upstream release, refresh
      flake.lock, then check+build. Pass TAG=vX.Y.Z to pin explicitly
      instead of auto-detecting the latest.
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        FLAKE="{{.PKG_DIR}}/flake.nix"
        TAG="${TAG:-}"
        if [ -z "$TAG" ]; then
          TAG="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)"
          : "${TAG:?could not resolve latest upstream release tag}"
        fi
        # TAG travels in the environment, never spliced into the perl program text.
        if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.]*$ ]]; then
          echo "[-] TAG must look like vX.Y.Z, got: ${TAG}" >&2
          exit 1
        fi
        TAG="$TAG" perl -i -pe 's#(github:NousResearch/hermes-agent/)[^"]+#$1$ENV{TAG}#' "$FLAKE"
        echo "update: pinned hermes-agent-src to ${TAG}"
      - task: update:flake-lock
      - task: check
      - task: build

  update:flake-lock:
    internal: true
    desc: "Re-lock only hermes-agent-src (and what follows it); nixpkgs moves only via update:nixpkgs"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - nix flake update hermes-agent-src
      - |
        set -euo pipefail
        # nixpkgs-unstable tracks the exact nixpkgs upstream Hermes locks (see flake.nix).
        src="$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.hermes-agent-src.outPath')"
        REV="$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' "$src/flake.lock")"
        [[ "$REV" =~ ^[0-9a-f]{40}$ ]] || { echo "[-] could not read upstream's nixpkgs rev" >&2; exit 1; }
        REV="$REV" perl -i -pe 's#(nixpkgs-unstable\.url = "github:nixos/nixpkgs/)[^"]+#$1$ENV{REV}#' flake.nix
        nix flake update nixpkgs-unstable
        echo "[+] nixpkgs-unstable pinned to upstream Hermes's ${REV:0:7}"
      - task: check:inputs

  update:nixpkgs:
    desc: "Bump the stable nixpkgs (moves Chromium and every package; nixpkgs-unstable follows upstream Hermes via hermes:update)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - nix flake update nixpkgs
      - task: check:inputs
      - task: check
