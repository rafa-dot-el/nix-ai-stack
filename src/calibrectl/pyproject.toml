[project]
name = "calibrectl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "bibtexparser>=1.4",
  "pypdf>=4.0",
  "ebooklib>=0.18",
]

[project.scripts]
calibrectl = "calibrectl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
addopts = "-ra --cov=calibrectl --cov-branch --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["calibrectl/cli.py", "calibrectl/__main__.py"]

[tool.uv.extra-build-dependencies]
"bibtexparser" = ["setuptools"]
