version: "3"

silent: true

# Included from the root Taskfile as pkg:notebooklm-py; builds through the root flake.
# Source is the upstream git tag (fetchFromGitHub), not PyPI.
vars:
  DEF: "{{.TASKFILE_DIR}}/default.nix"
  ATTR: "{{.ROOT_DIR}}#notebooklm-py"

tasks:
  build:
    desc: "Build notebooklm-py"
    cmds:
      - nix build "{{.ATTR}}" --no-link

  test:
    desc: "Build notebooklm-py's smoke check"
    cmds:
      - nix build "{{.ROOT_DIR}}#checks.x86_64-linux.notebooklm-py-smoke" --no-link

  check-update:
    desc: "Exit 0 if the upstream git repo has a newer v<semver> tag; exit 1 if current; exit 2 on errors"
    cmds:
      - |
        set -euo pipefail
        LOCAL="$(grep -m1 '^  version = ' "{{.DEF}}" | sed -E 's/^  version = "([^"]*)";$/\1/')"
        REMOTE="$(git ls-remote --tags --refs https://github.com/teng-lin/notebooklm-py.git 'refs/tags/v*' \
          | sed -E 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
        if [ -z "$REMOTE" ] || [ -z "$LOCAL" ]; then
          echo "[-] check-update: could not read versions (local='$LOCAL' remote='$REMOTE')" >&2; exit 2
        fi
        if [ "$REMOTE" = "$LOCAL" ]; then echo "[*] check-update: notebooklm-py up to date ($LOCAL)"; exit 1; fi
        echo "[*] check-update: notebooklm-py $LOCAL -> $REMOTE"

  update:
    desc: "Bump to upstream git tag v<VERSION> (default: newest): rev, source hash, build, test"
    cmds:
      - |
        set -euo pipefail
        REPO="https://github.com/teng-lin/notebooklm-py"
        V="${VERSION:-$(git ls-remote --tags --refs "$REPO.git" 'refs/tags/v*' \
          | sed -E 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)}"
        [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "[-] update: unexpected version '$V'" >&2; exit 2; }
        REV="$(git ls-remote --tags "$REPO.git" "refs/tags/v$V^{}" | cut -f1)"
        [ -n "$REV" ] || REV="$(git ls-remote --tags "$REPO.git" "refs/tags/v$V" | cut -f1)"
        [[ "$REV" =~ ^[0-9a-f]{40}$ ]] || { echo "[-] update: no commit for tag v$V" >&2; exit 2; }
        H="$(nix store prefetch-file --unpack --json "$REPO/archive/$REV.tar.gz" | jq -r .hash)"
        [[ "$H" =~ ^sha256- ]] || { echo "[-] update: could not prefetch source for $REV" >&2; exit 2; }
        V="$V" perl -i -pe 's/^  version = "[^"]*";/  version = "$ENV{V}";/' "{{.DEF}}"
        REV="$REV" perl -i -pe 's|^    rev = "[^"]*";|    rev = "$ENV{REV}";|' "{{.DEF}}"
        H="$H" perl -i -pe 's|^    hash = "sha256[^"]*";|    hash = "$ENV{H}";|' "{{.DEF}}"
        echo "[+] update: notebooklm-py v$V ($REV, $H)"
      - task: build
      - task: test
