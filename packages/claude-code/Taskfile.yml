version: "3"

silent: true

# Included from the root Taskfile as pkg:claude-code; builds through the root flake.
vars:
  DEF: "{{.TASKFILE_DIR}}/default.nix"
  ATTR: "{{.ROOT_DIR}}#claude-code"

tasks:
  build:
    desc: "Build claude-code"
    cmds:
      - nix build "{{.ATTR}}" --no-link

  test:
    desc: "Build claude-code's smoke test (passthru.tests.smoke)"
    cmds:
      - nix build "{{.ATTR}}.passthru.tests.smoke" --no-link

  check-update:
    desc: "Exit 0 if npm has a newer version; exit 1 if current; exit 2 on errors"
    cmds:
      - |
        set -euo pipefail
        REMOTE="$(curl -fsSL 'https://registry.npmjs.org/@anthropic-ai/claude-code/latest' | jq -r '.version')"
        LOCAL="$(grep -m1 '^  version = ' "{{.DEF}}" | sed -E 's/^  version = "([^"]*)";$/\1/')"
        if [ -z "${REMOTE}" ] || [ -z "${LOCAL}" ]; then
          echo "[-] check-update: failed to parse REMOTE='${REMOTE}' LOCAL='${LOCAL}'" >&2
          exit 2
        fi
        if [ "$REMOTE" = "$LOCAL" ]; then
          echo "[*] check-update: claude-code up to date (${LOCAL})"
          exit 1
        fi
        echo "[*] check-update: claude-code ${LOCAL} -> ${REMOTE}"

  update:
    desc: "Bump to the latest npm version: fetch the binary, hash it, patch default.nix, build, test"
    cmds:
      - |
        set -euo pipefail
        REMOTE="${VERSION:-$(curl -fsSL 'https://registry.npmjs.org/@anthropic-ai/claude-code/latest' | jq -r '.version')}"
        # Values travel in the environment, never spliced into the perl program text.
        if ! [[ "$REMOTE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "[-] update: unexpected version '${REMOTE}'" >&2; exit 2
        fi
        # Same bucket content as downloads.claude.ai (manifest sha256 matches); see default.nix.
        # The prefetched hash is what the build pins, so a different binary fails the build.
        URL="https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/${REMOTE}/linux-x64/claude"
        HASH="$(nix store prefetch-file --json "$URL" | jq -r .hash)"
        V="$REMOTE" perl -i -pe 's/^  version = "[^"]*";/  version = "$ENV{V}";/' "{{.DEF}}"
        H="$HASH" perl -i -pe 's|^    hash = "sha256[^"]*";|    hash = "$ENV{H}";|' "{{.DEF}}"
        echo "[+] update: claude-code ${REMOTE} (${HASH})"
      - task: build
      - task: test
