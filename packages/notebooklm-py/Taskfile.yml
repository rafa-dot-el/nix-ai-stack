version: "3"

silent: true

# Included from the root Taskfile as pkg:notebooklm-py; builds through the root flake.
vars:
  DEF: "{{.TASKFILE_DIR}}/default.nix"
  ATTR: "{{.ROOT_DIR}}#notebooklm-py"

tasks:
  build:
    desc: "Build notebooklm-py"
    cmds:
      - nix build "{{.ATTR}}" --no-link

  test:
    desc: "Build notebooklm-py's smoke check"
    cmds:
      - nix build "{{.ROOT_DIR}}#checks.x86_64-linux.notebooklm-py-smoke" --no-link

  check-update:
    desc: "Exit 0 if PyPI has a newer version; exit 1 if current; exit 2 on errors"
    cmds:
      - |
        set -euo pipefail
        LOCAL="$(grep -m1 '^  version = ' "{{.DEF}}" | sed -E 's/^  version = "([^"]*)";$/\1/')"
        REMOTE="$(curl -fsSL https://pypi.org/pypi/notebooklm-py/json | jq -r .info.version)"
        if [ -z "$REMOTE" ] || [ -z "$LOCAL" ]; then
          echo "[-] check-update: could not read versions (local='$LOCAL' remote='$REMOTE')" >&2; exit 2
        fi
        if [ "$REMOTE" = "$LOCAL" ]; then echo "[*] check-update: notebooklm-py up to date ($LOCAL)"; exit 1; fi
        echo "[*] check-update: notebooklm-py $LOCAL -> $REMOTE"

  update:
    desc: "Bump to PyPI's latest sdist: patch version and hash, build, test"
    cmds:
      - |
        set -euo pipefail
        V="${VERSION:-$(curl -fsSL https://pypi.org/pypi/notebooklm-py/json | jq -r .info.version)}"
        [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "[-] update: unexpected version '$V'" >&2; exit 2; }
        HEX="$(curl -fsSL "https://pypi.org/pypi/notebooklm-py/$V/json" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')"
        H="$(nix hash convert --hash-algo sha256 --to sri "$HEX")"
        V="$V" perl -i -pe 's/^  version = "[^"]*";/  version = "$ENV{V}";/' "{{.DEF}}"
        H="$H" perl -i -pe 's|^    hash = "sha256[^"]*";|    hash = "$ENV{H}";|' "{{.DEF}}"
        echo "[+] update: notebooklm-py $V ($H)"
      - task: build
      - task: test
