[package]
name = "slack"
description = "Slack CLI and MCP server: rich sending, drafts, policy, read and analysis tools"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "slack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
mcp-serve = { path = "../mcp-serve" }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-async-rw"] }
schemars = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
tokio = { version = "1", features = ["full"] }
globset.workspace = true
regex.workspace = true
rafa-config = { path = "../rafa-config" }
serde = { workspace = true }
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "server", "transport-async-rw", "transport-child-process"] }
